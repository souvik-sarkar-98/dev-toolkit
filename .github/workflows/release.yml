# Changesets npm publish via deploy-platform reusable-ci-publish.yml
# (this workspace’s deploy-main repo).

name: Release

on:
  workflow_dispatch:  
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/**'
      - '.changeset/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: nabarun-ngo/ngo-nabarun-deploy/.github/workflows/reusable-ci-publish.yml@main
    with:
      templates_repository: 'nabarun-ngo/ngo-nabarun-deploy'
      node_version: '22'
      working_directory: '.'
      npm_scope: '@ssdev-toolkit'
      version_command: 'npm run version-packages'
      publish_to_npm: true
      publish_command: 'npm run release'
      prerelease_publish_command: 'npm run release:beta'
      stable_branch: main
      prerelease_branch: stage
      prerelease_tag: beta
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
