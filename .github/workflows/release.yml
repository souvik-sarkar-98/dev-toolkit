# Library release for @ssdev-toolkit/*.
# develop publishes beta. main publishes latest.
# A push that only adds Changesets must still run, so this workflow has no path filter.

name: Release

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: nabarun-ngo/ngo-nabarun-deploy/.github/workflows/reusable-ci-publish.yml@main
    with:
      node_version: '22'
      working_directory: '.'
      npm_scope: '@ssdev-toolkit'
      version_command: 'npm run version-packages'
      publish_to_npm: true
      publish_command: 'npm run release'
      prerelease_publish_command: 'npm run release:beta'
      stable_branch: main
      prerelease_branch: develop
      prerelease_tag: beta
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
