<ng-container *ngIf="open">
  <div
    class="list-filter-sheet__backdrop"
    (click)="onBackdropClick()"
    aria-hidden="true">
  </div>

  <div class="list-filter-sheet" role="dialog" [attr.aria-label]="title">
    <div class="list-filter-sheet__handle" aria-hidden="true"></div>

    <div class="list-filter-sheet__title-row">
      <h2 class="list-filter-sheet__title">{{ title }}</h2>
      <button
        type="button"
        class="list-filter-sheet__close"
        (click)="onBackdropClick()"
        aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="list-filter-sheet__body">
      <cf-form
        *ngIf="definition"
        class="list-filter-sheet__form"
        [definition]="definition"
        [initialValues]="initialValues"
        [hideHeading]="true"
        [showSubmit]="false"
        idPrefix="filter">
      </cf-form>
    </div>

    <div class="list-filter-sheet__actions app-btn-group">
      <button type="button" class="app-btn app-btn--ghost" (click)="onReset()">
        Reset
      </button>
      <button type="button" class="app-btn app-btn--primary" (click)="onApply()">
        Apply
      </button>
    </div>
  </div>
</ng-container>
